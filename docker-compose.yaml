name: tg-file-stream-bot

services:
  fsb-run:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-file-stream-bot:local
    container_name: fsb
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - fsb-logs:/app/logs
      - fsb-sessions:/app/sessions
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./fsb.env

volumes:
  fsb-logs:
  fsb-sessions:
